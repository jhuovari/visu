# Kertakayttoinen apuri: tulostaa StatFin-taulujen rakenteen lokiin, jotta
# kyselyt voi kirjoittaa oikein. Poistetaan kun sivu on valmis.
name: Kartoita StatFin-taulut

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Ajettava skripti"
        type: string
        default: "tools/kartoita.R"

jobs:
  kartoita:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - run: Rscript "${{ inputs.script }}"
