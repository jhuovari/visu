# TILAPAINEN: tassa haarassa workflow ajaa vain StatFin-taulujen kartoituksen.
# Palautetaan alkuperainen ennen PR:aa.
name: Päivitä sivusto

on:
  workflow_dispatch:
    inputs:
      full_render:
        type: boolean
        default: false
      force:
        type: boolean
        default: false

jobs:
  kartoita:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - run: Rscript tools/kartoita.R
