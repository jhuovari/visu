# TILAPAINEN: ajaa datakokeilun. Palautetaan ennen PR:aa.
name: Päivitä sivusto
on:
  workflow_dispatch:
    inputs:
      full_render: { type: boolean, default: false }
      force: { type: boolean, default: false }
jobs:
  koeta:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - run: Rscript tools/koeta.R
