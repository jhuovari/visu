name: Päivitä sivusto

# StatFin julkaisee kello 8 Suomen aikaa. Cron on GitHubilla jaettu resurssi
# eikä käynnisty täsmällisesti: tässä repossa ajastetut ajot ovat käynnistyneet
# toistuvasti 6-7 tuntia myöhässä, ja GitHub varoittaa että ruuhkassa ajo voi
# jäädä kokonaan ajamatta. Yksi ajastus päivässä on siis yksi arpalippu.
#
# Siksi yritetään tunnin välein aamusta puolelle päivälle. Ikkuna kattaa
# molemmat tapaukset: ajallaan lauetessaan siihen mahtuu viisi yritystä kello
# 8:n julkaisun jälkeen, ja jos ajot myöhästyvät tuntikausia, ne osuvat saman
# työpäivän puolelle eivätkä valu iltaan. Ensimmäinen tuoreen datan tavoittava
# ajo tekee työn, ja loput eivät löydä rakennettavaa eivätkä tee committia --
# tyhjä ajo kestää puolitoista minuuttia. Minuutti on tunnin alun ulkopuolella,
# koska ruuhka on pahin tasatunnein.
#
# Erillistä kellovahtia ei tarvita. Ennen kello 8:aa käynnistyvä ajo ei löydä
# uutta dataa eikä tee committia, ja kellonaikaan sidottu vahti vaarantaisi
# juuri sen myöhästyneen ajon, jonka varaan tämä ajastus laskee.
on:
  schedule:
    - cron: "17 6-12 * * 1-5"
      timezone: "Europe/Helsinki"
  workflow_dispatch:
    inputs:
      full_render:
        description: "Renderöi koko sivusto (tarvitaan kun _quarto.yml muuttuu)"
        type: boolean
        default: false
      force:
        description: "Pakota kaikki kuviot uudelleen"
        type: boolean
        default: false

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paivita:
    runs-on: ubuntu-latest
    env:
      # Kuvioiden otsikot ovat suomeksi; ilman UTF-8-localea R kirjoittaisi
      # aakkoset sivulle koodattuina.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Kellonaika lokiin
        run: echo "Suomen aika $(TZ=Europe/Helsinki date), ajastus '${{ github.event.schedule }}'"

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pxwebtools ja ggcustom asentuvat DESCRIPTIONin Remotes-kentästä.
          extra-packages: local::.

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Päivitä muuttuneet kuviot
        run: |
          Rscript -e 'visu::visu_update_site(
            full = ${{ inputs.full_render && 'TRUE' || 'FALSE' }},
            force = ${{ inputs.force && 'TRUE' || 'NULL' }}
          )'

      - name: Commitoi muutokset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs && touch docs/.nojekyll
          git add -A docs site
          if git diff --cached --quiet; then
            echo "Ei muutoksia, ei committia."
            exit 0
          fi
          git commit -m "Päivitä sivuston kuviot"
          for yritys in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push epäonnistui, yritys $yritys"
            sleep $((2 ** yritys))
          done
          exit 1
