name: Päivitä sivusto

# Tämä workflow ei ajastu itse. Laukaisu tulee ulkopuolelta: Claude-rutiini
# kutsuu workflow_dispatchia arkiaamuina StatFinin kello 8 julkaisujen jälkeen.
#
# Syy on mitattu. GitHubin cron ei käynnisty tässä repossa lähellekään
# ajallaan: ajot lähtivät 31.8. kello 11:28 ja 13:30 UTC ja 1.9. kello 11:33
# UTC eli 6-7 tuntia myöhässä. Kun ajastus vaihdettiin tunnin välein
# yritettäväksi, useampi laukaisu ei tuonut useampaa yritystä: 3.9. seitsemästä
# erääntyneestä toteutui kaksi, kello 11:02 ja 15:49 Suomen aikaa. GitHub
# varoittaa itse, että ruuhkassa ajo voi jäädä kokonaan ajamatta. Rajapinnasta
# laukaistut ajot sen sijaan lähtevät heti, joten workflow_dispatch on ainoa
# tapa saada päivitys aamulla.
#
# Jos laukaisija on poissa, sivusto ei päivity. Silloin tämän workflow'n voi
# ajaa käsin Actions-välilehdeltä.
on:
  workflow_dispatch:
    inputs:
      full_render:
        description: "Renderöi koko sivusto (tarvitaan kun _quarto.yml muuttuu)"
        type: boolean
        default: false
      force:
        description: "Pakota kaikki kuviot uudelleen"
        type: boolean
        default: false

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paivita:
    runs-on: ubuntu-latest
    env:
      # Kuvioiden otsikot ovat suomeksi; ilman UTF-8-localea R kirjoittaisi
      # aakkoset sivulle koodattuina.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Kellonaika lokiin
        run: echo "Suomen aika $(TZ=Europe/Helsinki date)"

      - uses: actions/checkout@v4

      - name: Siirry haaran uusimpaan kommittiin
        # workflow_dispatch kiinnittää SHA:n laukaisuhetkellä, ja
        # samanaikaisuusryhmä pitää peräkkäiset laukaisut jonossa. Niinpä
        # jonosta vapautuva ajo lähtisi liikkeelle siitä kommitista, joka oli
        # tuorein kun se laukaistiin — ei siitä, jonka edellinen ajo juuri
        # pushasi. Se rakentaisi samat kuviot uudelleen ja törmäisi
        # commitissa generoitujen tiedostojen ristiriitaan (näin kävi ajossa
        # #62). Uusimman tilan kanssa kaksoisajo näkee lähdetaulujen leimat jo
        # kirjattuina eikä rakenna mitään.
        run: |
          # FETCH_HEAD eikä origin/<haara>: checkout tekee matalan kloonin,
          # jossa seurantaviitettä ei ole taattu, mutta fetch asettaa
          # FETCH_HEADin aina.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD
          git log -1 --format="Rakennetaan kommitista %h %s"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pxwebtools, ggcustom ja uljas asentuvat DESCRIPTIONin
          # Remotes-kentästä. dplyr on kuviosivujen eikä paketin riippuvuus, ja
          # readxl tarvitaan vain CPB:n Excel-työkirjan lukemiseen, joten
          # kumpikin nimetään tässä erikseen — DESCRIPTIONissa ne ovat vain
          # Suggests-kentässä.
          extra-packages: |
            local::.
            any::dplyr
            any::readxl

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Päivitä muuttuneet kuviot
        run: |
          Rscript -e 'visu::visu_update_site(
            full = ${{ inputs.full_render && 'TRUE' || 'FALSE' }},
            force = ${{ inputs.force && 'TRUE' || 'NULL' }}
          )'

      - name: Commitoi muutokset
        # Hajonnut kuvio ei saa estää muiden päivittymistä. Edellinen askel
        # rakentaa kuviot yksitellen ja kaatuu vasta lopuksi, joten valmiit
        # sivut ovat levyllä ja ne commitoidaan. Ajo jää silti punaiseksi.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs && touch docs/.nojekyll
          git add -A docs site
          if git diff --cached --quiet; then
            echo "Ei muutoksia, ei committia."
            exit 0
          fi
          git commit -m "Päivitä sivuston kuviot"
          for yritys in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              # Ristiriita voi syntyä vain commitoiduissa poluissa, ja ne ovat
              # kaikki generoituja: kuvat, _freeze, tila ja luettelo. Niissä
              # voittaa tämän ajon juuri rakentama versio, koska se on tehty
              # tuoreimmasta datasta. Rebasessa --theirs on uudelleen
              # sovitettava commit eli juuri se. Jos sovitus ei siltikään
              # onnistu, rebase perutaan ja koko kierros yritetään uudelleen.
              if git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --theirs --; then
                git add -A docs site
                if GIT_EDITOR=true git rebase --continue; then
                  git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
                fi
              fi
              git rebase --abort 2> /dev/null || true
            fi
            echo "Push epäonnistui, yritys $yritys"
            sleep $((2 ** yritys))
          done
          exit 1
